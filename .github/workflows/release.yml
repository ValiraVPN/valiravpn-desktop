name: Release

# Tagging is what publishes. `v1.2.3` on main, and the installer follows.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Kept for a dry run: builds and uploads the artefact, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A tag that disagrees with the manifest would ship an installer
      # advertising a version the executable does not carry. Caught here rather
      # than discovered by whoever downloads it.
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $manifest = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "manifest $manifest, tag $tag"
          if ($manifest -ne $tag) {
            throw "Cargo.toml says $manifest but the tag says $tag"
          }

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --lib --locked

      # Present on the hosted image; installed only if that ever stops being
      # true, so the workflow does not quietly depend on the runner's contents.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        run: |
          & "$env:ISCC" installer\valira.iss

      # The installer takes its version from the executable's own resources, so
      # the file name is found rather than assumed.
      - name: Checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\out\*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer was produced" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File "$($setup.FullName).sha256" -Encoding ascii -NoNewline
          Write-Host "$($setup.Name)  $hash"
          "SETUP=$($setup.FullName)" >> $env:GITHUB_ENV

      - name: Upload the build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/out/*
          if-no-files-found: error

      # Only on a tag. A manual run stops at the artefact above.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "$env:SETUP" "$env:SETUP.sha256" `
            --title "ValiraVPN Desktop ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
