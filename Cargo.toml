[package]
name = "valira-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "valira_desktop"
path = "src/lib.rs"

# The executable carries the manifest that demands administrator rights, and
# Cargo attaches it to any test harness built from this target as well — such a
# harness then refuses to start unelevated. The tests live in the library, so
# this target needs none.
[[bin]]
name = "valira-desktop"
path = "src/main.rs"
test = false

[dependencies]
base64 = "0.23.0"
directories = "6.0.0"
getrandom = "0.4.3"
# `rustls-no-provider` rather than `rustls`: the latter drags in aws-lc, which
# is C and needs cmake and a compiler to build. That makes the client
# unbuildable on a minimal Linux install and impossible to cross-compile at all.
# The provider is chosen here instead — see `api::Client::new`, which installs
# it before the first connection.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "blocking", "charset", "http2"] }
rustls = { version = "0.23.4", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

# UI.
#   backend-winit       -> winit windowing, required by the Win32 title bar subclass
#   renderer-femtovg    -> GPU rasteriser, the only one that can present a
#                          TRANSPARENT window, which is what the acrylic
#                          backdrop shows through
#   renderer-software   -> CPU rasteriser, the fallback on machines with no
#                          usable OpenGL driver; there the window is opaque
#   unstable-winit-030  -> exposes slint::winit_030 (HWND access) for win32_frame.rs
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "unstable-winit-030",
] }
# Embedded tunnel: boringtun carries the WireGuard protocol, tun-rs owns the
# device. Together they replace the WireGuard the user would otherwise install.
#   interruptible -> a TUN read that a shutdown can cancel, on every platform;
#                    without it the reader thread would sit blocked for as long
#                    as the tunnel stayed quiet.
boringtun = { version = "0.7", default-features = false }
tun-rs = { version = "2.8", features = ["interruptible"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[build-dependencies]
embed-resource = "3"
slint-build = "1.17.1"

# Custom title bar while keeping the native Windows frame.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    # Asking the service manager directly whether the tunnel is up. Shelling out
    # to `sc query` costs ~113 ms a call, and it is called on every poll and all
    # through teardown.
    "Win32_System_Services",
    # The named mutex that keeps the client to one instance. `CreateMutexW`
    # takes SECURITY_ATTRIBUTES, so it is gated behind the security feature too.
    "Win32_System_Threading",
    "Win32_Security",
] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
